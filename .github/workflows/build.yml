name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create/update releases.
# (Org/repo setting: Settings → Actions → General → Workflow permissions → "Read and write".)
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OUTPUT_DIR: dist
  EXE_NAME: JJKCC-Unpacker.exe

jobs:
  build:
    name: Compile the exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/JJKCC-Unpacker.csproj -c Release -o $env:OUTPUT_DIR --nologo -v minimal
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Smoke test
        shell: pwsh
        run: ./tools/smoke-test.ps1 -Path (Join-Path $env:OUTPUT_DIR $env:EXE_NAME)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JJKCC-Unpacker-${{ github.sha }}
          path: dist/JJKCC-Unpacker.exe
          if-no-files-found: error

      # ── 'beta' release: always points at the newest good build of main ───────
      - name: Move the beta tag to this build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true      # tag protection rules may forbid moving it; the release still updates
        shell: pwsh
        run: |
          git tag -f beta $env:GITHUB_SHA
          git push -f origin "refs/tags/beta"

      - name: Update beta release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta (latest main)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/JJKCC-Unpacker.exe
          fail_on_unmatched_files: true
          body: |
            Automatic build of the latest `main`.

            **Download:** [`JJKCC-Unpacker.exe`](https://github.com/${{ github.repository }}/releases/download/beta/JJKCC-Unpacker.exe)

            Stands in for **JJK Mod Kit → Setup → Import Game Assets** in the JujutsuKaisenCC
            project: unpack the game paks with retoc, stub the animation blueprints, delete the
            assets that crash the editor, move everything into the project `Content` folder, and
            clean up the temporary `Data` folder.

            * Commit: `${{ github.sha }}`
            * Built: `${{ github.run_id }}` on ${{ github.ref_name }}
            * Needs Windows 10/11 + .NET Framework 4.8 (preinstalled) and `Tools\retoc.exe`
              in the Unreal project. See the [README](https://github.com/${{ github.repository }}#readme).

      # ── optional: real version tags also get a release ──────────────────────
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JJKCC-Unpacker.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
